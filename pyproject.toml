[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "sunback"
version = "0.6.17.3"
description = "Sets your desktop background to the most recent images of the Sun."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "C. R. Gilly", email = "chris.gilly@colorado.edu" }
]
urls = { "Homepage" = "https://github.com/GillySpace27/sunback" }
requires-python = ">=3.11"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Topic :: Desktop Environment",
  "Topic :: Desktop Environment :: Screen Savers",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
]

dependencies = [
        "boto3",
        "matplotlib",
        "sunpy",
        "astropy",
        "scipy",
        "opencv-python",
        "xarray",
        "requests",
        "setuptools",
        "numpy",
        "tqdm",
        "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
        ]

[project.optional-dependencies]
test = ["pytest", "pytest-runner"]

"server"= [
        "twine",
        "pillow",
        "moviepy",
        "parfive",
        "beautifulsoup4",
        "html5lib",
        "numpy",
        "sunkit-image",
        "aiapy",
    ]

[project.scripts]
sunback-run = "sunback.run.run_client_background:run_client"
sunback-serve = "sunback.run.run_server_lingon:run_server_lingon"


[tool.setuptools]
# SB-12, 2026-10-02: MANIFEST.in grafts all of sunback/ into the sdist; with
# include-package-data on, every notebook, log and the Windows DLL under
# sunback/ reached the wheel. Only package-data below ships now.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
# SB-12, 2026-10-02: was a bare find over the repository root, which installed
# devtools, docs, data, resources, web and aws_lambda into site-packages.
include = ["sunback", "sunback.*"]
exclude = ["attic", "attic.*", "sunback.__tests__", "sunback.__tests__.*",
           "sunback.processor.tests", "sunback.processor.tests.*",
           "*.dep", "*.dep.*", "*.depricated", "*.depricated.*"]

[tool.setuptools.package-data]
# SB-12, 2026-10-02: was "*" = ["*"] (every file in every package).
# "*" = ["*"]
"sunback.science" = ["idl_3.csv"]

[tool.pytest.ini_options]
testpaths = ["sunback/__tests__", "sunback/processor/tests"]
markers = ["network: needs the internet; deselected by default"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["attic", "build", "**/dep", "**/depricated", "*.ipynb", "webapp", "sunback_data",
                  "devtools/scripts/git-filter-repo.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# Moved from setup.cfg by SB-12, 2026-10-02. [flake8] max-line-length = 119 is
# covered by [tool.ruff] line-length; [aliases] test = pytest and [versioneer]
# have no pyproject equivalent and stay in attic/packaging/setup.cfg; the
# coverage omit entry for sunback/_version.py went to the attic with that file.
[tool.coverage.run]
omit = ["*/tests/*"]

[tool.yapf]
column_limit = 119
indent_width = 4
use_tabs = false
