# Release sunback to PyPI from a bare version tag such as 0.6.17.4 (never v*) (SB-12).
# build: tag equals pyproject version, tag commit is on master, sdist and wheel,
#        wheel audit, install the wheel outside the checkout and compare the version.
# testpypi: upload to TestPyPI (environment testpypi, trusted publishing).
# pypi: upload to PyPI (environment pypi). Gilly is the required reviewer of that
# environment, so nothing reaches PyPI until he approves the job. Only Gilly pushes tags.
# Runbook: RELEASING.md.
name: release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag equals the pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=${GITHUB_REF_NAME} pyproject=${version}"
          test "${version}" = "${GITHUB_REF_NAME}"

      - name: Tagged commit is on master
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/master

      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      - name: Wheel audit
        run: python devtools/scripts/check_wheel.py dist/*.whl

      - name: Install the wheel outside the checkout and read its version
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          v=$(/tmp/wheel-venv/bin/python -c "import sunback, sunback.science.color_tables; print(sunback.__version__)")
          echo "installed sunback ${v}"
          test "${v}" = "${GITHUB_REF_NAME}"

      - name: Keep the built files for the upload jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sunback
    permissions:
      id-token: write
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sunback
    permissions:
      id-token: write
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
