# Gate for every change (SB-2): unit tests, a compile check and a narrow ruff rule
# set on every pull request and every push, in the reducer's own container image.
# Read-only: no AWS credentials, no OIDC token, nothing is published.
name: tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gillyspace27/sunback-ci:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install sunback and the test tools
        run: |
          python --version
          pip install .
          pip install pytest==9.1.1 ruff==0.15.20

      - name: Unit tests
        run: python -m pytest -q

      - name: Compile check
        run: python -m compileall -q -x '(/dep/|/depricated/)' sunback aws_lambda

      - name: Lint
        run: ruff check

  # Windows run of the same unit tests (replaces the retired AppVeyor build).
  # The Linux job runs in the reducer's container; Windows uses setup-python at
  # the container's Python version and installs the same requirement files.
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # python -m pip, not a bare "pip install .": devtools/scripts/reducer_lock.py
      # pins the Linux job by matching that exact line, which must stay unique.
      - name: Install sunback and the test tools
        run: |
          python --version
          python -m pip install -r requirements.txt -r requirements-server.txt
          python -m pip install .
          python -m pip install pytest==9.1.1

      - name: Unit tests
        run: python -m pytest -q --junitxml=pytest-windows.xml

      # Failing tests as annotations (GitHub keeps 10 per step, so they are
      # batched), readable from the checks API without downloading the log.
      - name: Annotate failing tests
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          lines = []
          for case in ET.parse("pytest-windows.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  msg = " ".join((bad.get("message") or "").split())[:160]
                  lines.append(f"{case.get('classname')}.{case.get('name')}: {msg}")
          step = max(1, -(-len(lines) // 10))
          for k in range(0, len(lines), step):
              print("::error title=Windows failures::" + " %0A".join(lines[k:k + step]))

  em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No new em dashes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BASE="$BEFORE"
          else BASE="origin/$DEFAULT_BRANCH"; fi
          echo "base: $BASE"
          python3 devtools/scripts/no_em_dash.py --base "$BASE"
